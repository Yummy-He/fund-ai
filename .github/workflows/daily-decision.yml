# 每日: 先判断交易日 → 抓取净值 → 快速回测
# 北京时间 17:30 (UTC 09:30), 周一至周五

name: Daily Scrape & Decision

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-decision.yml"
      - "pyproject.toml"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml requests beautifulsoup4 lxml click rich python-dateutil httpx anthropic aiohttp

      - name: Check if today is a trading day
        id: trading_day
        shell: python
        run: |
          import os, akshare as ak
          from datetime import date
          df = ak.tool_trade_date_hist_sina()
          today_str = date.today().strftime("%Y%m%d")
          is_td = "true" if today_str in df["trade_date"].values else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IS_TRADING_DAY={is_td}\n")
          print(f"Trading day: {is_td}")

      - name: Scrape today's NAV data
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.cli scrape

      - name: Quick daily review (recent 60 days, weekly decisions)
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          END_DATE=$(date +%Y-%m-%d)
          START_DATE=$(date -d "60 days ago" +%Y-%m-%d)
          python -m src.cli backtest \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --interval 5

      - name: Commit and push
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "daily: scrape + review $(date +%Y-%m-%d)"
          git push

      - name: Skip (non-trading day)
        if: steps.trading_day.outputs.IS_TRADING_DAY != 'true'
        run: echo "Today is not a trading day, skipping."
