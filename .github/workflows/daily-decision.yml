# 每日: 先判断交易日 → 抓取净值 → 快速回测
# 北京时间 17:30 (UTC 09:30), 周一至周五

name: Daily Scrape & Decision

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-decision.yml"
      - "pyproject.toml"
      - "config/**.yaml"
      - "src/**/*.py"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml requests beautifulsoup4 lxml click rich python-dateutil httpx anthropic aiohttp

      - name: Check if today is a trading day
        id: trading_day
        shell: python
        run: |
          import os
          from datetime import date

          today = date.today()
          today_dash = today.strftime("%Y-%m-%d")
          is_td = "false"

          try:
              import akshare as ak

              # 第一层: 交易日历 (新浪) — trade_date 格式为 YYYY-MM-DD
              df = ak.tool_trade_date_hist_sina()
              trade_dates = set(str(d) for d in df["trade_date"])
              if today_dash in trade_dates:
                  is_td = "true"
                  print(f"交易日历命中: {today_dash}")

              # 第二层: 日历未覆盖今天 → 查上证指数最新交易日
              if is_td == "false":
                  idx = ak.stock_zh_index_daily(symbol="sh000001")
                  latest = str(idx["date"].max())
                  if latest == today_dash:
                      is_td = "true"
                      print(f"上证指数确认: 最新交易日={latest}")
                  else:
                      print(f"非交易日: 上证最新={latest}, 今天={today_dash}")
          except Exception as e:
              print(f"akshare 查询异常: {e}")

          # 第三层: akshare 完全不可用时的回退
          if is_td == "false":
              is_td = "true" if today.weekday() < 5 else "false"
              print(f"回退到工作日判断: weekday={today.weekday()}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IS_TRADING_DAY={is_td}\n")
          print(f"最终结果 - 交易日: {is_td}")

      - name: Scrape today's NAV data
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.cli scrape

      - name: Quick daily review (recent 60 days, weekly decisions)
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          END_DATE=$(date +%Y-%m-%d)
          START_DATE=$(date -d "60 days ago" +%Y-%m-%d)
          python -m src.cli backtest \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --interval 5

      - name: Commit and push
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "daily: scrape + review $(date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push

      - name: Skip (non-trading day)
        if: steps.trading_day.outputs.IS_TRADING_DAY != 'true'
        run: echo "Today is not a trading day, skipping."
