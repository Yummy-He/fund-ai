# 每日: scrape 总是执行 → 交易日则 live 交易 + 回测
# 北京时间 00:30 (UTC 16:30), 周一至周六（UTC 周日-周五）
# 周六只 scrape 数据不交易，周一~周五正常交易

name: Daily Scrape & Decision

on:
  # [WORKFLOW_PAUSED 2026-08-07] schedule 已注释暂停，取消注释即可恢复
  # schedule:
  #   - cron: "30 16 * * 0-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/TRIGGER"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml requests beautifulsoup4 lxml click rich python-dateutil httpx anthropic aiohttp

      - name: Check if today (Beijing time) is a trading day
        id: trading_day
        shell: python
        run: |
          import os
          import concurrent.futures
          from datetime import date, timedelta, datetime, timezone

          # 北京时间
          beijing_tz = timezone(timedelta(hours=8))
          beijing_now = datetime.now(beijing_tz)
          beijing_today = beijing_now.date()
          today_str = beijing_today.strftime("%Y-%m-%d")
          is_td = "false"

          def call_ak_with_timeout(func, *args, timeout=30):
              """给 akshare 调用加超时保护，防止无限挂起"""
              with concurrent.futures.ThreadPoolExecutor(max_workers=1) as executor:
                  future = executor.submit(func, *args)
                  return future.result(timeout=timeout)

          try:
              import akshare as ak

              # 第一层: 交易日历 (新浪) — trade_date 格式为 YYYY-MM-DD
              df = call_ak_with_timeout(ak.tool_trade_date_hist_sina, timeout=30)
              trade_dates = set(str(d) for d in df["trade_date"])
              if today_str in trade_dates:
                  is_td = "true"
                  print(f"交易日历命中: {today_str}")

              # 第二层: 日历未覆盖 → 查上证指数最新交易日
              if is_td == "false":
                  idx = call_ak_with_timeout(ak.stock_zh_index_daily, symbol="sh000001", timeout=30)
                  latest = str(idx["date"].max())
                  if latest == today_str:
                      is_td = "true"
                      print(f"上证指数确认: 最新交易日={latest}")
                  else:
                      print(f"非交易日: 上证最新={latest}, 今天={today_str}")
          except Exception as e:
              print(f"akshare 查询失败(超时或异常): {e}")

          # 第三层: akshare 完全不可用时的回退
          if is_td == "false":
              is_td = "true" if beijing_today.weekday() < 5 else "false"
              print(f"回退到工作日判断: weekday={beijing_today.weekday()}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IS_TRADING_DAY={is_td}\n")
              f.write(f"TODAY={today_str}\n")
          print(f"北京时间={beijing_today}, 交易日: {is_td}")

      - name: Scrape latest NAV data (always)
        timeout-minutes: 15
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.cli scrape

      - name: Live trading simulation
        timeout-minutes: 10
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.cli live -d ${{ steps.trading_day.outputs.TODAY }}

      - name: Quick daily review (recent 60 days)
        timeout-minutes: 5
        if: steps.trading_day.outputs.IS_TRADING_DAY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          END_DATE=${{ steps.trading_day.outputs.TODAY }}
          START_DATE=$(date -d "$END_DATE - 60 days" +%Y-%m-%d)
          python -m src.cli backtest \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --interval 5

      - name: Commit and push (always)
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add data/ reports/ experiences/
          if [ "${{ steps.trading_day.outputs.IS_TRADING_DAY }}" = "true" ]; then
            MSG="daily: scrape + live + review ${{ steps.trading_day.outputs.TODAY }}"
          else
            MSG="daily: scrape only ${{ steps.trading_day.outputs.TODAY }}"
          fi
          git diff --staged --quiet || git commit -m "$MSG"
          git pull --rebase -X theirs origin main
          git push
