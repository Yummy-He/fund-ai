# 每月1日: 深度学习 + 综合报告
# 北京时间 12:00 (UTC 04:00)

name: Monthly Deep Report

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "学习迭代轮数"
        default: "20"
  push:
    paths:
      - ".github/workflows/monthly-report.yml"
      - "pyproject.toml"

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml requests beautifulsoup4 lxml click rich python-dateutil httpx anthropic aiohttp

      - name: Deep learning (20 iterations)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m src.cli learn \
            --iterations ${{ github.event.inputs.iterations || 20 }}

      - name: Generate monthly recommendation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MONTH=$(date +%Y-%m)
          python -m src.cli recommend \
            --output "reports/recommendations/${MONTH}.md"

      - name: Commit and push
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add experiences/ reports/ data/
          git diff --staged --quiet || git commit -m "monthly: deep learn + report $(date +%Y-%m)"
          git push
