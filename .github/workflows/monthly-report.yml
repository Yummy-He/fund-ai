# 月度综合报告
# 每月1号北京时间 12:00 运行
# 包含: 全面回测 + 策略评估 + 投资建议 + GitHub Issue

name: Monthly Comprehensive Report

on:
  schedule:
    # 每月1日 UTC 04:00（北京时间 12:00）
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e "."

      - name: Run deep learning (20 iterations)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m src.cli learn --iterations 20

      - name: Generate detailed recommendations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MONTH=$(date +%Y-%m)
          python -m src.cli recommend \
            --output "reports/recommendations/${MONTH}.md" \
            --detailed

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `reports/recommendations/${new Date().toISOString().slice(0,7)}.md`;
            let report = '';
            try {
              report = fs.readFileSync(
                `reports/recommendations/current.md`, 'utf8'
              ).slice(0, 60000);  // GitHub issue body 限制
            } catch {
              report = '报告生成失败，请查看 repo 中的 reports/ 目录。';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 基金投资月报 - ${new Date().toISOString().slice(0,7)}`,
              body: report,
              labels: ['monthly-report', 'auto-generated']
            });

      - name: Commit and push
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add experiences/ reports/backtests/ reports/recommendations/ data/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 月度综合报告 $(date +%Y-%m)"
            git push
          fi
