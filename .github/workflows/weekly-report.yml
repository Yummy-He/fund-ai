# 每周六: 学习回测 + 投资建议报告
# 北京时间 周六 10:00 (UTC 02:00)

name: Weekly Learn & Report

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      iterations:
        description: "学习迭代轮数"
        default: "5"
  push:
    paths:
      - ".github/workflows/weekly-report.yml"
      - "pyproject.toml"

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml requests beautifulsoup4 lxml click rich python-dateutil httpx anthropic aiohttp

      - name: Scrape latest data
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.cli scrape

      - name: Learning loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m src.cli learn \
            --iterations ${{ github.event.inputs.iterations || 5 }}

      - name: Generate weekly recommendation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          WEEK=$(date +%Y-W%V)
          python -m src.cli recommend \
            --output "reports/recommendations/weekly-${WEEK}.md"

      - name: Commit and push
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add data/ experiences/ reports/
          git diff --staged --quiet || git commit -m "weekly: learn + report $(date +%Y-W%V)"
          git push
