# 每周回测学习
# 北京时间 周六 10:00 运行（UTC+8 = 02:00 UTC 周六）
# 选择周末，避免交易时间占用 API 额度影响实时分析
# 同时此时一周数据已完整

name: Weekly Backtest & Learning

on:
  schedule:
    # 每周六 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      iterations:
        description: "学习迭代次数"
        required: false
        default: "5"

jobs:
  backtest-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e "."

      - name: Run learning loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m src.cli learn \
            --iterations ${{ github.event.inputs.iterations || 5 }}

      - name: Generate investment recommendations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m src.cli recommend --output reports/recommendations/current.md

      - name: Commit and push results
        run: |
          git config user.name "fund-ai-bot"
          git config user.email "bot@fund-ai.local"
          git add experiences/ reports/backtests/ reports/recommendations/
          if git diff --staged --quiet; then
            echo "无新结果，跳过提交"
          else
            git commit -m "chore: 每周回测学习结果 $(date +%Y-%m-%d)"
            git push
          fi
